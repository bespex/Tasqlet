name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: npm ci
      - name: Frontend check (svelte-check, prettier)
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Rust format
        run: cargo fmt --all --check
      # tauri-build needs the frontend output folder to exist
      - name: Rust lint
        run: mkdir -p dist && cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
