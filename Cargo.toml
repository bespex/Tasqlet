[workspace]
members = ["crates/tasqlet-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.3.0"
authors = ["Bert Speckels <skrrytch@speckels.net>"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/bespex/Tasqlet"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
