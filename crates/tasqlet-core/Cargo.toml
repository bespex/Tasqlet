[package]
name = "tasqlet-core"
description = "Domain logic of Tasqlet: items, transitions, storage, quick-entry parser, smart labels"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dirs = "7.0.0"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ulid = { version = "3.0.0", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
